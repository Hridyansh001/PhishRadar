<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishRadar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-left">
        <svg class="brand-shield" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <circle cx="12" cy="11" r="3"/>
        </svg>
        <div class="header-text">
          <h1>Phish<span class="accent">Radar</span></h1>
          <span class="tagline">Stay Safe. Browse Smarter.</span>
        </div>
      </div>
      <div class="header-right">
        <div class="protection-group">
          <span class="protection-label">Protection</span>
          <span class="protection-status" id="toggle-label">ON</span>
        </div>
        <label class="toggle-switch" for="protection-toggle">
          <input type="checkbox" id="protection-toggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </header>

    <!-- Stats Cards -->
    <div class="stats-row">
      <div class="stat-card">
        <svg class="stat-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span class="stat-number" id="stat-scanned">0</span>
        <span class="stat-label">Sites scanned</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card">
        <svg class="stat-icon stat-icon-blocked" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f85149" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
        </svg>
        <span class="stat-number stat-number-blocked" id="stat-blocked">0</span>
        <span class="stat-label">Sites blocked</span>
      </div>
    </div>

    <!-- Current Website -->
    <div class="section">
      <div class="section-title">Current website</div>
      <div class="website-card" id="tab-info">
        <div class="website-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div class="website-info">
          <span class="website-url" id="tab-url">—</span>
          <span class="website-status" id="website-status">
            <span class="status-dot safe"></span>
            Safe
          </span>
        </div>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#484f58" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    </div>

    <!-- Last Scan -->
    <div class="section">
      <div class="section-title">Last scan</div>
      <div class="website-card" id="last-scan-card">
        <div class="website-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="website-info">
          <span class="website-url" id="last-scan-time">No scans yet</span>
          <span class="website-status" id="last-scan-result">Waiting for activity</span>
        </div>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#484f58" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    </div>

    <!-- Scan Result Panel (hidden by default) -->
    <div class="scan-panel hidden" id="scan-panel">
      <div class="scan-header" id="scan-header">
        <span class="scan-verdict" id="scan-verdict">—</span>
        <span class="scan-score" id="scan-score"></span>
      </div>
      <div class="scan-message" id="scan-message"></div>
      <div class="scan-details" id="scan-details"></div>
    </div>

    <!-- Hidden scan button (triggered programmatically) -->
    <button class="btn-scan-hidden" id="btn-scan" style="display:none;">Scan</button>

    <!-- Footer -->
    <footer class="popup-footer">
      <div class="footer-item" id="btn-settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.5">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </div>
      <div class="footer-divider"></div>
      <a class="footer-item" href="http://localhost:5173" target="_blank" id="dashboard-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="1.5">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span>View full report</span>
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
