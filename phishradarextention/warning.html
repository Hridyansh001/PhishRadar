<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚠️ PhishRadar Warning</title>
  <link rel="stylesheet" href="warning.css">
</head>
<body>
  <!-- Top-left brand -->
  <div class="brand-bar">
    <svg class="brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <circle cx="12" cy="11" r="3"/>
    </svg>
    <span class="brand-name">Phish<span class="brand-accent">Radar</span></span>
  </div>

  <div class="warning-container">
    <!-- Warning Triangle Icon -->
    <div class="danger-icon">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" stroke="#f85149" stroke-width="1.8" fill="none"/>
        <line x1="12" y1="10" x2="12" y2="14" stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="17" r="0.5" fill="#f85149"/>
      </svg>
    </div>

    <!-- Title -->
    <h1 class="warning-title"><span class="text-danger">Dangerous</span> Site Blocked</h1>

    <!-- URL Display Bar -->
    <div class="url-bar">
      <svg class="url-link-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span class="url-text" id="destination-url">—</span>
    </div>

    <!-- Detection Details Table -->
    <div class="detection-table">
      <div class="table-row">
        <span class="table-label">Verdict</span>
        <span class="table-value" id="detail-verdict">—</span>
      </div>
      <div class="table-row">
        <span class="table-label">Risk Score</span>
        <span class="table-value" id="detail-score">—</span>
      </div>
      <div class="table-row">
        <span class="table-label">Risk Level</span>
        <span class="table-value" id="detail-risklevel">—</span>
      </div>
      <div class="table-row">
        <span class="table-label">ML Result</span>
        <span class="table-value" id="detail-ml">—</span>
      </div>
      <div class="table-row">
        <span class="table-label">Regex Result</span>
        <span class="table-value" id="detail-regex">—</span>
      </div>
    </div>

    <!-- Hidden elements for JS compatibility -->
    <div id="destination-domain" style="display:none;"></div>
    <div id="findings-section" style="display:none;">
      <div id="findings-list"></div>
    </div>
    <div id="warning-message" style="display:none;"></div>

    <!-- Action Buttons -->
    <div class="warning-actions">
      <button class="btn btn-back" id="btn-block">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Go Back to Safety
      </button>
      <button class="btn btn-continue" id="btn-continue">
        Continue Anyway
      </button>
    </div>
  </div>

  <script src="warning.js"></script>
</body>
</html>
